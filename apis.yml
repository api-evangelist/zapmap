- aid: zapmap:zapmap-spark-plan-api
  name: Zapmap Spark Plan API
  description: >-
    Commercial EV route-planning API that returns a highly configurable route
    plan generated by Zapmap's routing engine, selecting charging stops against
    driver preferences such as price, on-site facilities or minimal deviation
    from route, for display in a partner's own customer-facing interface. No
    base URL, endpoints, request or response schema, authentication scheme or
    specification is published; access is via the business contact form only.
  humanURL: https://www.zapmap.com/for-business/products/zapmap-spark/plan-api
  tags:
  - EV Charging
