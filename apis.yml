apis:
- aid: zapmap:zapmap-spark-search-api
  name: Zapmap Spark Search API
  description: >-
    Commercial charge point search API returning Zapmap's aggregated charging
    location data for over 50,000 public charging locations across the UK and
    Ireland — location, availability status (in use / out of service), kWh
    pricing, CPO network, power output, plus enriched site facility and access
    information. Zapmap states coverage of 95% of UK public charge points with
    live real-time data on roughly 75% of them. No base URL, endpoint list,
    authentication scheme, rate limits or machine-readable specification is
    published; the only documented route to access is the business contact form.
  humanURL: https://www.zapmap.com/for-business/products/zapmap-spark/search-api
  tags:
