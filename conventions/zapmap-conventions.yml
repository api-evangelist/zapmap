no_openapi:
  reason: >-
    No OpenAPI, Swagger, GraphQL or AsyncAPI document exists for this surface —
    /v5/openapi.json, /v5/swagger.json and /v5/docs all answer with the same
    "Missing API Key" 401 (the auth check precedes routing), and the host-root
    equivalents 404. No specification is written into openapi/ from these
    observations: paths and methods are evidence, schemas would be invention.
