- aid: zapmap:zapmap-spark-pay-api
  name: Zapmap Spark Pay API
  description: >-
    Commercial cross-network EV charging payment API that lets a partner
    application start and stop charging sessions and receive live in-session
    updates on cost, time and kWh across Zap-Pay enabled chargers — Zapmap cites
    10,000+ charge points across leading UK CPO networks reachable through a
    single integration. No base URL, endpoints, authentication scheme or roaming
    protocol (no OCPI or OCPP reference appears anywhere in Zapmap's public
    material) is published; access is via the business contact form only.
  humanURL: https://www.zapmap.com/for-business/products/zapmap-spark/pay-api
