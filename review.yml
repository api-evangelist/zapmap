specHarvest:
  openapiHarvested: false
  specsCount: 0
  note: >-
    Zero machine-readable API artifacts exist to harvest. No OpenAPI, Swagger,
    Postman collection, AsyncAPI, GraphQL schema, JSON Schema, WSDL or WADL was
    found on zapmap.com, zap-map.com, or any probed subdomain. No openapi/
    directory is created because there is nothing real to put in it.
ownership:
  note: >-
    Good Energy plc took a 12.9% holding in Zapmap's parent Next Green Car in
    March 2019 and exercised its option to a 50.1% majority stake, announced
    25 June 2020 (https://www.zapmap.com/news/good-energy-increases-stake-in-zap-map,
    HTTP 200). Recorded as reported by Zapmap; current cap table not
    independently re-verified as of this review.
